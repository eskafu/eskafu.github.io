<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f0e9"><title>Guia LoRA — 24 Poses</title><style>

:root { --ink:#171a18; --muted:#6f746f; --paper:#f2f0e9; --card:#faf9f5; --line:#d8d5cb; --accent:#d7ff3f; --dark:#222722; }
* { box-sizing:border-box; }
html { background:var(--paper); }
body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
button { font:inherit; color:inherit; }
button:focus-visible { outline:3px solid #657c00; outline-offset:3px; }
main { min-height:100vh; display:flex; flex-direction:column; }
.topbar { height:84px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,4vw,64px); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:12px; border:0; background:none; cursor:pointer; text-align:left; padding:0; }
.brandmark { width:42px; height:42px; display:grid; place-items:center; border-radius:50%; background:var(--dark); color:var(--accent); font-weight:800; }
.brand b,.brand small { display:block; }.brand b { font-size:15px; }.brand small { margin-top:2px; color:var(--muted); font-size:12px; }
.header-actions { display:flex; align-items:center; gap:10px; }.text-button,.icon-button { border:1px solid var(--line); background:rgba(255,255,255,.45); border-radius:999px; cursor:pointer; }
.text-button { padding:10px 16px; font-size:13px; font-weight:700; }.icon-button { width:40px; height:40px; font-size:20px; }
.session-head { padding:16px clamp(20px,4vw,64px) 0; }
.outfit-tabs { display:grid; grid-template-columns:repeat(4,1fr); max-width:860px; gap:6px; }
.outfit-tabs button { display:grid; grid-template-columns:1fr auto; gap:2px 10px; border:0; background:transparent; padding:10px 13px; border-radius:10px; cursor:pointer; color:var(--muted); font-size:13px; text-align:left; }
.outfit-tabs button em { grid-column:1/-1; font-size:10px; font-style:normal; opacity:.62; }
.outfit-tabs button.active { background:var(--dark); color:white; }.outfit-tabs small { opacity:.68; }
.total-progress { height:3px; background:#dedcd4; margin-top:15px; overflow:hidden; }.total-progress span { display:block; height:100%; background:#7d9d00; transition:width .25s ease; }
.guide { flex:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr); padding:clamp(20px,3vw,42px) clamp(20px,4vw,64px); gap:clamp(28px,5vw,80px); align-items:center; max-width:1500px; width:100%; margin:0 auto; }
.visual-panel { min-height:560px; height:min(66vh,760px); position:relative; border-radius:24px; overflow:hidden; background:#dedbd1; }
.visual-panel img { width:100%; height:100%; object-fit:cover; display:block; }
.image-badge,.captured-badge { position:absolute; top:18px; border-radius:999px; padding:9px 13px; font-size:12px; font-weight:700; backdrop-filter:blur(10px); }
.image-badge { left:18px; background:rgba(250,249,245,.88); }.image-badge span { font-size:15px; }
.captured-badge { right:18px; background:var(--accent); color:#263000; }
.instruction-panel { max-width:570px; }
.step-meta { display:flex; justify-content:space-between; gap:20px; align-items:center; color:var(--muted); font-size:12px; }
.eyebrow { text-transform:uppercase; letter-spacing:.14em; font-weight:800; color:#667c08; }
.instruction-panel h1,.overview h1 { font-size:clamp(38px,5vw,72px); line-height:.94; letter-spacing:-.055em; margin:22px 0; }
.direction { font-size:clamp(18px,2vw,24px); line-height:1.45; max-width:530px; }
dl { margin:35px 0; border-top:1px solid var(--line); }
dl div { padding:18px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:150px 1fr; gap:22px; }
dt { color:var(--muted); font-size:12px; line-height:1.4; text-transform:uppercase; letter-spacing:.06em; } dd { margin:0; font-size:14px; line-height:1.5; font-weight:700; }
.controls { display:grid; grid-template-columns:auto 1fr auto; gap:8px; }
.controls button { min-height:54px; border-radius:12px; padding:0 16px; border:1px solid var(--line); cursor:pointer; font-size:13px; font-weight:800; }
.controls button:disabled { opacity:.32; cursor:not-allowed; }.previous,.next { background:transparent; }.capture { background:var(--dark); color:white; border-color:var(--dark)!important; }.capture.is-done { background:var(--accent); color:#273000; }
.dots { display:grid; grid-template-columns:repeat(24,1fr); gap:4px; margin-top:22px; }.dots button { border:0; padding:0; height:5px; border-radius:3px; background:#d5d2ca; cursor:pointer; }.dots button.done { background:#97b51b; }.dots button.current { background:var(--ink); transform:scaleY(1.8); }
.overview { flex:1; width:100%; max-width:1500px; margin:0 auto; padding:38px clamp(20px,4vw,64px) 70px; }
.overview-title { display:flex; align-items:end; justify-content:space-between; gap:30px; margin-bottom:35px; }.overview-title h1 { margin:10px 0 0; }.overview-title p { max-width:360px; color:var(--muted); line-height:1.5; }
.pose-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }.pose-tile { position:relative; border-radius:16px; overflow:hidden; background:var(--card); border:1px solid var(--line); }.pose-tile.checked { opacity:.62; }
.tile-open { display:block; width:100%; border:0; padding:0; background:none; text-align:left; cursor:pointer; }.tile-open img { width:100%; aspect-ratio:4/3; display:block; object-fit:cover; background:#ddd9cf; }
.tile-number { position:absolute; top:10px; left:10px; padding:6px 8px; border-radius:8px; background:rgba(250,249,245,.9); font-size:11px; font-weight:900; }.tile-copy { display:block; padding:13px 46px 15px 14px; }.tile-copy small,.tile-copy b { display:block; }.tile-copy small { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }.tile-copy b { font-size:14px; }
.tile-check { position:absolute; bottom:13px; right:12px; width:27px; height:27px; border-radius:50%; border:1px solid #aaa99f; background:var(--paper); cursor:pointer; font-weight:900; }.checked .tile-check { background:var(--accent); border-color:#8aa400; }
footer { display:flex; justify-content:space-between; gap:20px; padding:15px clamp(20px,4vw,64px); color:var(--muted); border-top:1px solid var(--line); font-size:11px; }
@media (max-width:900px) { .guide { grid-template-columns:1fr; align-items:start; }.visual-panel { min-height:0; height:auto; aspect-ratio:4/3; }.instruction-panel { max-width:none; }.pose-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:620px) { .topbar { height:70px; }.brand small { display:none; }.session-head { padding-top:10px; }.outfit-tabs { gap:3px; }.outfit-tabs button { display:block; padding:9px 4px; text-align:center; }.outfit-tabs button em { display:none; }.outfit-tabs small { display:block; margin-top:3px; }.guide { padding-top:18px; gap:22px; }.visual-panel { border-radius:16px; }.step-meta { margin-top:2px; }.instruction-panel h1 { font-size:42px; margin:15px 0; }.direction { font-size:17px; } dl { margin:22px 0; } dl div { grid-template-columns:1fr; gap:6px; padding:13px 0; }.controls { grid-template-columns:1fr 1fr; }.capture { grid-row:1; grid-column:1/-1; }.previous { grid-row:2; }.next { grid-row:2; }.dots { margin-top:17px; }.overview-title { display:block; }.overview-title p { font-size:13px; }.pose-grid { grid-template-columns:repeat(2,1fr); gap:9px; }.tile-copy { min-height:66px; }.header-actions .text-button { padding:9px 11px; } footer { display:block; } footer span { display:block; margin:3px 0; } }

.offline-note{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.offline-note:before{content:"";width:7px;height:7px;border-radius:50%;background:#7d9d00}
</style></head>

const state = { outfit:0, index:0, overview:false, done:loadProgress() };
function loadProgress(){try{return JSON.parse(localStorage.getItem("lora-guide-progress-v2")||"[]")}catch{return []}}
function save(){localStorage.setItem("lora-guide-progress-v2",JSON.stringify(state.done))}
function key(outfit,pose){return outfit+"-"+pose}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toggle(id=outfits[state.outfit].poses[state.index].id){const item=key(state.outfit,id);state.done=state.done.includes(item)?state.done.filter(x=>x!==item):[...state.done,item];save();render()}
function goOutfit(i){state.outfit=i;state.index=0;state.overview=false;render()}
function goPose(i){state.index=i;state.overview=false;render()}
function next(){if(state.index<23)state.index++;else if(state.outfit<3){state.outfit++;state.index=0}render()}
function previous(){if(state.index>0)state.index--;else if(state.outfit>0){state.outfit--;state.index=23}render()}
function resetAll(){if(confirm("Apagar todo o progresso das quatro roupas?")){state.done=[];state.outfit=0;state.index=0;save();render()}}
function tabs(){return outfits.map((plan,i)=>{const count=plan.poses.filter(p=>state.done.includes(key(i,p.id))).length;return '<button role="tab" aria-selected="'+(state.outfit===i)+'" class="'+(state.outfit===i?'active':'')+'" onclick="goOutfit('+i+')"><span>'+esc(plan.name)+'</span><em>'+esc(plan.focus)+'</em><small>'+count+'/24</small></button>'}).join("")}
function overview(plan){return '<section class="overview"><div class="overview-title"><div><span class="eyebrow">'+esc(plan.name)+' · '+esc(plan.focus)+'</span><h1>As 24 fotografias</h1></div><p>'+esc(plan.description)+'. Toca numa pose para abrir ou marcar como capturada.</p></div><div class="pose-grid">'+plan.poses.map((p,i)=>{const checked=state.done.includes(key(state.outfit,p.id));return '<article class="pose-tile '+(checked?'checked':'')+'"><button class="tile-open" onclick="goPose('+i+')"><img src=".'+esc(p.image)+'" alt="Exemplo: '+esc(p.title)+'"><span class="tile-number">'+String(p.id).padStart(2,'0')+'</span><span class="tile-copy"><small>'+esc(p.group)+'</small><b>'+esc(p.title)+'</b></span></button><button class="tile-check" onclick="toggle('+p.id+')" aria-label="'+(checked?'Desmarcar ':'Marcar ')+esc(p.title)+'">'+(checked?'✓':'')+'</button></article>'}).join("")+'</div></section>'}
function guide(plan){const p=plan.poses[state.index],checked=state.done.includes(key(state.outfit,p.id)),count=plan.poses.filter(x=>state.done.includes(key(state.outfit,x.id))).length;return '<section class="guide"><div class="visual-panel"><img src=".'+esc(p.image)+'" alt="Referência visual da pose '+esc(p.title)+'"><div class="image-badge"><span>'+String(p.id).padStart(2,'0')+'</span> / 24</div>'+(checked?'<div class="captured-badge">✓ Capturada</div>':'')+'</div><div class="instruction-panel"><div class="step-meta"><span class="eyebrow">'+esc(plan.name)+' · '+esc(plan.focus)+' · '+esc(p.group)+'</span><span>'+count+' de 24 concluídas</span></div><h1>'+esc(p.title)+'</h1><p class="direction">'+esc(p.direction)+'</p><dl><div><dt>Enquadramento</dt><dd>'+esc(p.framing)+'</dd></div><div><dt>Confirmar antes de avançar</dt><dd>'+esc(p.check)+'</dd></div></dl><div class="controls"><button class="previous" '+(state.index===0&&state.outfit===0?'disabled':'')+' onclick="previous()">← Anterior</button><button class="capture '+(checked?'is-done':'')+'" onclick="toggle()">'+(checked?'✓ Fotografia capturada':'Marcar como capturada')+'</button><button class="next" '+(state.index===23&&state.outfit===3?'disabled':'')+' onclick="next()">Seguinte →</button></div><div class="dots" aria-label="Pose '+(state.index+1)+' de 24">'+plan.poses.map((x,i)=>'<button onclick="goPose('+i+')" class="'+(i===state.index?'current ':'')+(state.done.includes(key(state.outfit,x.id))?'done':'')+'" aria-label="Ir para pose '+x.id+'"></button>').join("")+'</div></div></section>'}
function render(){const plan=outfits[state.outfit],total=state.done.length;document.getElementById("app").innerHTML='<main><header class="topbar"><button class="brand" onclick="state.overview=false;render()"><span class="brandmark">24</span><span><b>Guia LoRA</b><small>sessão de captura</small></span></button><div class="header-actions"><button class="text-button" onclick="state.overview=!state.overview;render()">'+(state.overview?'Voltar à sessão':'Ver todas')+'</button><button class="icon-button" onclick="resetAll()" title="Reiniciar progresso">↺</button></div></header><section class="session-head"><div class="outfit-tabs" role="tablist">'+tabs()+'</div><div class="total-progress"><span style="width:'+(total/96*100)+'%"></span></div></section>'+(state.overview?overview(plan):guide(plan))+'<footer><span>'+total+'/96 fotografias no total</span><span class="offline-note">Funciona offline · progresso guardado neste dispositivo</span></footer></main>'}
render();
</script></body></html>
